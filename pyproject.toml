[project]
name = "rosehill"
version = "0.1.0"
description = "Find underpriced lots on Rosehill Auctions in the final hours before they close."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "apscheduler>=3.10,<4",
    "fastapi>=0.115",
    "httpx>=0.28",
    "jinja2>=3.1",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.17",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.32",
]

[project.scripts]
rosehill = "rosehill.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.13",
    "playwright==1.63.0",
    "pytest>=8.3",
    "pytest-playwright>=0.6",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rosehill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["e2e: drives the dashboard in a real browser (needs Playwright's Chromium)"]
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient. is deprecated"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["rosehill"]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true
